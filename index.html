<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
  
     <form action="Registration form">
        
     <H1>REGISTRATION FORM</H1>
     <br>
     <br>
     <br>
     <br>

     <div>
     <div>
         <label for="Enter Your Name">Enter Your Name :</label><i class="fa-sharp fa-solid fa-user"></i> <input  type="text" id="name" required = "required">
      </div>
      <br>
      <br>
      
      <div>
      <div >
      <label for="Enter Your Last Name">Enter Your last name :</label><i class="fa-notdog-duo fa-solid fa-user"></i><input type="text" id="last-name" required = "required">
      </div>
      <br>
      <br>
      <div>
      <div>
        <label for="tel">Enter Your Phone Number :</label><i class="fa-solid fa-phone"></i><input type="tel" id="phone" required = "required">
      </div>
      <br>
      <br>
      <div>
      <div>
      <label for="Address">Enter Your Address :</label><i class="fa-solid fa-address-card"></i> <input type="text" id="address" required="required">
      </div>
      <br>
      <br>
      <div>
      <div>
        <label for="DOB">Enter Your Date Of Birth :</label><i class="fa-regular fa-calendar-days"></i><input type="date" id="dob" required="required">
      </div>
      <br>
      <br>
      <div>
        <div>
          <label for="gender">Select Gender :</label><select id="gender" required="required">                                                                                                                                            
        <option value="male">Male</option>
        <option value="female">Female</option>
        <option value="other">Other</option>
    </select>
    <i class="fa-solid fa-people-group"></i>
      </div>
     <br>
     <br>
     <div>
     <div>
        <label for="CNIC ">Enter Your CNIC or Father CNIC :</label> <i class="fa-solid fa-id-card"></i><input type="text" id="father-cnic"required="required">
     </div>
     <br>
     <br>
     <div>
      <div>
        <label for="b.foam num">Enter Your B.Foam Num :</label><i class="fa-solid fa-bed"></i> <input type="text" id="bfoam-number" required="required">
      </div>
      <br>
      <br>
      <div>
        <div>
          <label for="Country">Enter Your Country :</label><i class="fa-solid fa-flag"></i><input type="text" id="country" required="required">
        </div>
        <br>
        <br>
        <center> <button type="submit" class="bt">Register</button></center>
     
    </form>

</body>
</html>
